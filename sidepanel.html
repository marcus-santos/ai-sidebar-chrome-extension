<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Sidebar</title>
    <icon></icon>
    <link rel="stylesheet" href="sidepanel.css">
    <script src="sidepanel.js" defer></script>
  </head>
  <body>
    <main class="panels">
      <section
        id="assistant-panel"
        class="panel"
        aria-label="ChatGPT"
        data-service="chatgpt"
      >
        <iframe src="https://chatgpt.com" title="ChatGPT"></iframe>
      </section>
      <section
        id="assistant-panel-claude"
        class="panel"
        aria-label="Claude"
        data-service="claude"
        hidden
      >
        <iframe src="https://claude.ai" title="Claude"></iframe>
      </section>
      <section
        id="assistant-panel-gemini"
        class="panel"
        aria-label="Gemini"
        data-service="gemini"
        hidden
      >
        <iframe src="https://gemini.google.com" title="Gemini"></iframe>
      </section>
    </main>
    <div class="assistant-switcher">
      <button
        id="assistant-toggle"
        class="assistant-toggle"
        type="button"
        aria-label="Abrir menu de assistentes. Atual: ChatGPT"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="assistant-menu"
      >
        <img id="current-assistant-icon" src="icons/chatgpt.svg" alt="">
        <svg class="toggle-arrow" viewBox="0 0 16 16" aria-hidden="true">
          <path d="m4 6 4 4 4-4" />
        </svg>
      </button>
      <div
        id="assistant-menu"
        class="assistant-menu"
        role="menu"
        aria-label="Selecionar assistente"
        aria-hidden="true"
        inert
      >
        <button class="assistant-option" type="button" role="menuitemradio" aria-checked="true" data-service="chatgpt">
          <img class="service-icon" src="icons/chatgpt.svg" alt="">
          <span>ChatGPT</span>
        </button>
        <button class="assistant-option" type="button" role="menuitemradio" aria-checked="false" data-service="claude">
          <img class="service-icon" src="icons/claude.svg" alt="">
          <span>Claude</span>
        </button>
        <button class="assistant-option" type="button" role="menuitemradio" aria-checked="false" data-service="gemini">
          <img class="service-icon" src="icons/icon48.png" alt="">
          <span>Gemini</span>
        </button>
      </div>
    </div>
  </body>
</html>
