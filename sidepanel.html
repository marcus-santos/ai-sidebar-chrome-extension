<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Sidebar</title>
    <icon></icon>
    <link rel="stylesheet" href="sidepanel.css">
    <script src="sidepanel.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <label id="assistant-label" for="assistant-select">Assistente</label>
      <div class="select-shell">
        <select id="assistant-select" aria-controls="assistant-panel">
          <option value="chatgpt">ChatGPT</option>
          <option value="claude">Claude</option>
          <option value="gemini">Gemini</option>
        </select>
      </div>
    </header>
    <main class="panels">
      <section
        id="assistant-panel"
        class="panel"
        aria-label="ChatGPT"
        data-service="chatgpt"
      >
        <iframe src="https://chatgpt.com" title="ChatGPT"></iframe>
      </section>
      <section
        id="assistant-panel-claude"
        class="panel"
        aria-label="Claude"
        data-service="claude"
        hidden
      >
        <iframe src="https://claude.ai" title="Claude"></iframe>
      </section>
      <section
        id="assistant-panel-gemini"
        class="panel"
        aria-label="Gemini"
        data-service="gemini"
        hidden
      >
        <iframe src="https://gemini.google.com" title="Gemini"></iframe>
      </section>
    </main>
  </body>
</html>
